<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom</title>
    <link rel="stylesheet" href="./Resources/Styles/style.css">
    <link rel="stylesheet" href="./Resources/Styles/media-mockup.css">
</head>
<body>
    <header data-pagename="Newsroom"></header>
    <main>
        <div class="Container GridContainer ContainerGap-Medium">
            <div class="MediaHero">
                <div class="MediaHeroContent">
                    <span class="MediaHeroTag">Featured</span>
                    <h1 class="MediaHeroTitle"></h1>
                    <p class="MediaHeroExcerpt"></p>
                    <div class="MediaHeroMeta"></div>
                    <a class="MediaHeroLink btn" href="#" target="_blank" rel="noopener">Read the story &rarr;</a>
                </div>
            </div>
        </div>

        <div class="Container GridContainer ContainerGap-Medium">
            <ol class="MediaEditorialList"></ol>
        </div>

        <div class="Container GridContainer ContainerGap-Medium">
            <div class="MediaSocialSection">
                <div class="MediaSectionHead">
                    <h2>Social Highlights</h2>
                    <span class="MediaSectionCount MediaSocialCount"></span>
                </div>
                <div class="MediaSocialGrid"></div>
            </div>
        </div>

        <div class="Container GridContainer ContainerGap-Medium">
            <div class="MediaKitBox">
                <div>
                    <h3>Want to Get Involved?</h3>
                    <p>We've developed messaging guides for you to communicate how extreme heat is impacting your community.</p>
                </div>
                <div class="MediaKitToolkitList">
                    <a class="MediaKitToolkitItem btn" href="./Resources/Assets/Documents/back-to-school-in-extreme-heat-toolkit.pdf" target="_blank" rel="noopener">Schools and Childcare Toolkit</a>
                    <span class="MediaKitToolkitItem MediaKitToolkitItem--pending">Safe Homes (to come)</span>
                    <span class="MediaKitToolkitItem MediaKitToolkitItem--pending">Safe Workplaces (to come)</span>
                    <span class="MediaKitToolkitItem MediaKitToolkitItem--pending">Safe Communities (to come)</span>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>

    <script type="module" src="./Resources/Scripts/Script.js"></script>
    <script type="module" src="./Resources/Scripts/Media.js"></script>
</body>
</html>
